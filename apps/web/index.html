<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#344a3d" />
    <meta
      name="description"
      content="A welcoming space for mindful living, personalised wellness care and learning at your own pace."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Sri Durga Wellness</title>

  <body>
    <!-- splash:start -->
    <!--
      Loading screen. Plain HTML + CSS + inline SVG, so it appears the moment the page starts loading
      (every visit and every refresh), before any JavaScript runs. src/app/splash.ts fades it out
      once the app has rendered; moving between pages inside the site never shows it.
    -->
    <style>
      #sdw-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
          max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
        background:
          radial-gradient(42vmax 42vmax at 50% 42%, rgba(167, 181, 160, 0.34), transparent 65%),
          radial-gradient(60vmax 40vmax at 50% 112%, rgba(230, 220, 203, 0.85), transparent 70%),
          radial-gradient(50vmax 40vmax at 0% 0%, rgba(231, 236, 227, 0.9), transparent 60%), #faf8f2;
        color: #344a3d;
        transition:
          opacity 0.8s cubic-bezier(0.22, 0.61, 0.36, 1),
          visibility 0.8s;
      }
      #sdw-splash.sdw-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      /* Fine botanical line drawings that grow in two corners. */
      #sdw-splash .sdw-sprig {
        position: absolute;
        width: clamp(110px, 20vmin, 220px);
        height: auto;
        overflow: visible;
        fill: none;
        stroke: #a7b5a0;
        stroke-width: 1.3;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.75;
        animation: sdw-sway 8s ease-in-out 2.4s infinite;
      }
      #sdw-splash .sdw-sprig path {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        vector-effect: non-scaling-stroke;
        animation: sdw-draw 1.4s cubic-bezier(0.45, 0, 0.2, 1) forwards;
      }
      #sdw-splash .sdw-sprig-a {
        left: max(10px, 3vw);
        bottom: -10px;
        transform-origin: 30% 100%;
      }
      #sdw-splash .sdw-sprig-b {
        right: max(10px, 3vw);
        top: -10px;
        rotate: 180deg;
        transform-origin: 50% 50%;
        animation-delay: 3.4s;
      }
      @media (max-width: 600px) {
        #sdw-splash .sdw-sprig {
          width: 92px;
          opacity: 0.6;
        }
        #sdw-splash .sdw-sprig-a {
          left: 4px;
        }
        #sdw-splash .sdw-sprig-b {
          right: 4px;
        }
      }
      #sdw-splash .sdw-inner {
        position: relative;
        display: grid;
        justify-items: center;
        text-align: center;
        transition: transform 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      #sdw-splash.sdw-leaving .sdw-inner {
        transform: translateY(-12px) scale(0.985);
      }
      #sdw-splash .sdw-emblem {
        position: relative;
        width: 148px;
        height: 148px;
        margin-bottom: 26px;
      }
      /* Two soft rings that breathe outwards, like a slow exhale. */
      #sdw-splash .sdw-ripple {
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        border: 1px solid rgba(120, 134, 107, 0.35);
        animation: sdw-breathe 3.6s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
      }
      #sdw-splash .sdw-ripple + .sdw-ripple {
        animation-delay: 1.8s;
      }
      #sdw-splash .sdw-emblem svg {
        position: relative;
        width: 148px;
        height: 148px;
        overflow: visible;
      }
      #sdw-splash .sdw-disc {
        fill: #ffffff;
        filter: drop-shadow(0 14px 26px rgba(40, 58, 48, 0.14)) drop-shadow(0 2px 4px rgba(40, 58, 48, 0.06));
        transform-origin: 74px 74px;
        animation: sdw-pop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #sdw-splash .sdw-ring {
        fill: none;
        stroke: url(#sdw-ring-grad);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        transform: rotate(-90deg);
        transform-origin: 74px 74px;
        animation: sdw-draw 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
      }
      /* The loading indicator: a small leaf circling the emblem on a dotted path. */
      #sdw-splash .sdw-orbit {
        transform-origin: 74px 74px;
        opacity: 0;
        animation:
          sdw-fade 0.6s ease 1.1s forwards,
          sdw-spin 2.8s linear 1.1s infinite;
      }
      #sdw-splash .sdw-orbit-path {
        fill: none;
        stroke: rgba(120, 134, 107, 0.45);
        stroke-width: 1.2;
        stroke-dasharray: 0.5 6;
        stroke-linecap: round;
      }
      #sdw-splash .sdw-orbit-leaf {
        fill: #78866b;
      }
      #sdw-splash .sdw-leaf-fill {
        fill: url(#sdw-leaf-grad);
        opacity: 0;
        transform-origin: 70px 84px;
        animation: sdw-fill 0.9s ease 1.25s forwards;
      }
      #sdw-splash .sdw-leaf {
        fill: none;
        stroke: #344a3d;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: sdw-draw 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
      }
      #sdw-splash .sdw-leafgroup {
        transform-origin: 66px 92px;
        animation: sdw-sway 4.5s ease-in-out 2s infinite;
      }
      #sdw-splash .sdw-name {
        margin: 0;
        font-family: "Cormorant Garamond", "Noto Serif Tamil", Georgia, "Times New Roman", serif;
        font-size: clamp(2.1rem, 1.5rem + 2.6vw, 3.1rem);
        font-weight: 600;
        line-height: 1.12;
        letter-spacing: 0.015em;
        color: #344a3d;
        opacity: 0;
        animation: sdw-reveal 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.75s forwards;
      }
      #sdw-splash .sdw-divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0 12px;
        color: #78866b;
        opacity: 0;
        animation: sdw-fade 0.6s ease 1.05s forwards;
      }
      #sdw-splash .sdw-divider i {
        display: block;
        width: 52px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(120, 134, 107, 0.7));
        transform: scaleX(0);
        transform-origin: right center;
        animation: sdw-line 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
      }
      #sdw-splash .sdw-divider i + svg + i {
        background: linear-gradient(90deg, rgba(120, 134, 107, 0.7), transparent);
        transform-origin: left center;
      }
      #sdw-splash .sdw-divider svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }
      #sdw-splash .sdw-tagline {
        margin: 0;
        max-width: 42ch;
        font-family:
          "DM Sans",
          "Noto Sans Tamil",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        font-size: 0.8rem;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #5c6a50;
        opacity: 0;
        animation: sdw-reveal 1s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
      }
      #sdw-splash[lang="ta"] .sdw-tagline {
        letter-spacing: 0.02em;
        text-transform: none;
        font-size: 0.95rem;
      }
      /* A fine line that fills while the site loads, with a soft glowing tip. */
      #sdw-splash .sdw-progress {
        position: relative;
        width: 168px;
        height: 2px;
        margin-top: 28px;
        border-radius: 2px;
        background: rgba(120, 134, 107, 0.16);
        opacity: 0;
        animation: sdw-fade 0.5s ease 0.9s forwards;
      }
      #sdw-splash .sdw-progress::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 2px;
        background: linear-gradient(90deg, #a7b5a0, #344a3d);
        box-shadow: 0 0 10px rgba(52, 74, 61, 0.35);
        transform: scaleX(0);
        transform-origin: left center;
        animation: sdw-load 3s cubic-bezier(0.4, 0, 0.2, 1) 0.9s forwards;
      }
      @keyframes sdw-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes sdw-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes sdw-fill {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes sdw-pop {
        from {
          transform: scale(0.6);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes sdw-reveal {
        from {
          opacity: 0;
          transform: translateY(10px);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
      }
      @keyframes sdw-line {
        to {
          transform: scaleX(1);
        }
      }
      @keyframes sdw-load {
        0% {
          transform: scaleX(0);
        }
        60% {
          transform: scaleX(0.75);
        }
        100% {
          transform: scaleX(1);
        }
      }
      @keyframes sdw-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes sdw-breathe {
        0% {
          transform: scale(0.95);
          opacity: 0;
        }
        25% {
          opacity: 1;
        }
        100% {
          transform: scale(1.6);
          opacity: 0;
        }
      }
      @keyframes sdw-sway {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-2.5deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #sdw-splash *,
        #sdw-splash *::after {
          animation: none !important;
          transition: none !important;
        }
        #sdw-splash .sdw-ring,
        #sdw-splash .sdw-leaf,
        #sdw-splash .sdw-sprig path {
          stroke-dashoffset: 0;
        }
        #sdw-splash .sdw-leaf-fill,
        #sdw-splash .sdw-orbit,
        #sdw-splash .sdw-name,
        #sdw-splash .sdw-divider,
        #sdw-splash .sdw-tagline,
        #sdw-splash .sdw-progress {
          opacity: 1;
        }
        #sdw-splash .sdw-divider i {
          transform: none;
        }
        #sdw-splash .sdw-progress::after {
          transform: scaleX(0.6);
        }
        #sdw-splash .sdw-ripple {
          display: none;
        }
      }
    </style>

    <script>
      // Show the loading screen in the visitor's language (the same choice the app will make).
      (function () {
        window.__sdwSplashStart = Date.now();
        var ta = false;
        try {
          var saved = window.localStorage.getItem("sdw.locale");
          ta = saved
            ? saved === "ta"
            : /^ta\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || "");
        } catch (e) {
          ta = false;
        }
        if (!ta) return;
        var el = document.getElementById("sdw-splash");
        el.setAttribute("lang", "ta");
        el.querySelector('[data-sdw="name"]').textContent = "ஸ்ரீ துர்கா வெல்னஸ்";
        el.querySelector('[data-sdw="tagline"]').textContent = "சமநிலைக்கும் நலத்துக்குமான உங்கள் பயணம்";
        el.querySelector('[data-sdw="label"]').textContent = "ஏற்றப்படுகிறது…";
      })();
    </script>
